name: Assemble staged KiCad files

on:
  push:
    paths:
      - 'staging/**'
      - '.github/workflows/assemble-kicad.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !startsWith(github.event.head_commit.message, 'Assemble staged KiCad') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble complete staged files
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          shopt -s nullglob
          for dir in staging/*; do
            [ -d "$dir" ] || continue
            manifest="$dir/manifest.txt"
            [ -f "$manifest" ] || continue
            target=$(sed -n 's/^target=//p' "$manifest")
            parts=$(sed -n 's/^parts=//p' "$manifest")
            [ -n "$target" ] || continue
            [ -n "$parts" ] || continue
            count=$(find "$dir" -maxdepth 1 -name 'part-*.b64' | wc -l | tr -d ' ')
            if [ "$count" != "$parts" ]; then
              echo "Waiting for $dir: $count/$parts parts"
              continue
            fi
            echo "Assembling $target from $parts parts"
            tmp=$(mktemp)
            for p in $(find "$dir" -maxdepth 1 -name 'part-*.b64' | sort); do
              cat "$p" >> "$tmp"
            done
            base64 -d "$tmp" > "$target"
            rm -f "$tmp"
            changed=1
          done

          if [ "$changed" -eq 0 ]; then
            echo "No complete staged files yet."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.kicad_sch' '*.kicad_sym' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "Assemble staged KiCad detail files"
          git push
